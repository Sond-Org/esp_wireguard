---
name: Build examples
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # The ESP-IDF version the SOND firmware builds this component with.
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4
    strategy:
      fail-fast: false
      matrix:
        target:
          - esp32
        ip_version:
          - ipv4
          - ipv6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build examples/demo
        shell: bash
        working-directory: examples/demo
        run: |
          . "${IDF_PATH}/export.sh"
          if [ "${{ matrix.ip_version }}" = "ipv6" ]; then
            echo "CONFIG_LWIP_IPV6=y" >> sdkconfig.defaults
          else
            echo "CONFIG_LWIP_IPV6=n" >> sdkconfig.defaults
          fi
          idf.py set-target "${{ matrix.target }}"
          idf.py build
